services:
  postgres:
    image: postgres:16-alpine
    container_name: energy_pipeline_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-energy_pipeline}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: energy_pipeline_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pipeline}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pipeline}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-energy_pipeline}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
